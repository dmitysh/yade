[package]
name = "yade"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "yade_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.21.7"
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9.0"
vt100 = "0.18.1"
tempfile = "3"
tauri-plugin-dialog = "2"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
jsonc-parser = { version = "0.34", features = ["serde"] }
plist = "1"
ignore = "0.4"
regex = "1"
lsp-server = "0.10"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSAccessibility"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNError", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNUserNotificationCenter"] }
